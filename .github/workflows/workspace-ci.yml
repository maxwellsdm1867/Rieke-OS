name: Disco regression checks
on:
  pull_request:
  push:
    branches: [main, master, codex/rieke-native-e2e, codex/0.1.8-stable-ports]
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  architecture:
    name: Adopted architecture contract discovery
    runs-on: ubuntu-latest
    outputs:
      source_changed: ${{ steps.plan.outputs.source_changed }}
      javascript_required: ${{ steps.plan.outputs.javascript_required }}
      python_required: ${{ steps.plan.outputs.python_required }}
      desktop_required: ${{ steps.plan.outputs.desktop_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate references and select affected contracts
        id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--all)
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then args=(--base "$BASE_REF"); fi
          python3 -B tools/architecture_guard.py plan "${args[@]}" --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/architecture-plan.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adopted-architecture-plan
          path: ${{ runner.temp }}/architecture-plan.json
          if-no-files-found: error
  frontend:
    needs: architecture
    if: needs.architecture.outputs.javascript_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workspace-app/package-lock.json
      - run: npm ci
        working-directory: workspace-app
      - run: python3 -B tools/architecture_guard.py check --language javascript
      - name: Existing full frontend regression and build
        if: needs.architecture.outputs.source_changed == 'true'
        run: npm test && npm run build
        working-directory: workspace-app
      - name: Contract-only frontend checks
        if: needs.architecture.outputs.source_changed != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --test workspace-app/src/architectureImports.test.js
          python3 -B tools/architecture_guard.py test --base "$BASE_REF" --language javascript
  desktop-contracts:
    name: Scoped desktop lifecycle contracts
    needs: architecture
    if: needs.architecture.outputs.desktop_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workspace-app/package-lock.json
      # Reuse the existing ownership parser; no Electron/native installation.
      - run: npm ci
        working-directory: workspace-app
      - name: Mapped desktop CJS contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=(--all)
          if [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then args=(--base "$BASE_REF"); fi
          python3 -B tools/architecture_guard.py test "${args[@]}" --language desktop --output "$RUNNER_TEMP/desktop-contracts.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-lifecycle-contracts
          path: ${{ runner.temp }}/desktop-contracts.json
          if-no-files-found: error
  python:
    needs: architecture
    if: needs.architecture.outputs.python_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.13'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system --require-hashes -r python/workspace-runtime.lock
      - run: python -B tools/architecture_guard.py check --language python
      - run: python tools/build_release.py --validate-only
        if: needs.architecture.outputs.source_changed == 'true'
      - name: Reject mixed EpicTreeGUI source in Disco
        if: needs.architecture.outputs.source_changed == 'true' && (github.repository == 'maxwellsdm1867/disco' || github.repository == 'maxwellsdm1867/Rieke-OS')
        run: python tools/desktop_application_profile.py
      - name: Existing full Python regression
        if: needs.architecture.outputs.source_changed == 'true'
        run: python -m unittest discover -s python/tests -p 'test_*.py' -v
        env:
          PYTHONPATH: python
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Contract-only Python checks
        if: needs.architecture.outputs.source_changed != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python -B -m unittest python.tests.test_architecture_guard -v
          python -B tools/architecture_guard.py test --base "$BASE_REF" --language python
  native-mysql:
    needs: architecture
    if: needs.architecture.outputs.source_changed == 'true'
    name: Apple Silicon native project lifecycle and transfer
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workspace-app/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Require the advertised native architecture
        run: test "$(uname -m)" = arm64
      - name: Prepare private Python, frontend and native MySQL
        # actions/setup-python has no macOS ARM64 build for this patch release.
        # uv supplies the same pinned standalone interpreter used by app setup.
        run: uv run --no-project --python 3.11.13 python rieke.py setup
      - name: Verify app and native project readiness without Docker
        run: |
          .rieke-runtime/venv/bin/python - <<'PY'
          import json, sys
          sys.path.insert(0, 'python')
          from workspace_bootstrap import doctor
          status = doctor()
          print(json.dumps(status, indent=2))
          assert status['ready'] and status['project_open_ready'], 'App or bundled MySQL is not ready'
          assert not any(row['check'] == 'docker' for row in status['checks'])
          PY
      - name: Real database lifecycle, independent copies and logical transfer
        run: .rieke-runtime/venv/bin/python -m unittest python.tests.test_workspace_native_mysql python.tests.test_workspace_portability -v
        env:
          PYTHONPATH: python
          RIEKE_TEST_NATIVE_MYSQL: '1'
          RIEKE_TEST_NATIVE_TRANSFER: '1'
