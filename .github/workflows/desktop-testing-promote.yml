name: Publish checked Disco testing candidate
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Full clean source commit with successful full regression and million-row checks'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful complete desktop candidate run for the same source'
        required: true
        type: string
      verification_run_id:
        description: 'Optional successful complete verification run against the original immutable candidate bytes'
        required: false
        type: string
      notes_path:
        description: 'Reviewed Markdown release notes under release-evidence in this checkout'
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: disco-testing-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'maxwellsdm1867/Rieke-OS'
    runs-on: macos-15
    environment: desktop-publishing
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      NOTES_PATH: ${{ inputs.notes_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require successful exact-source checks before downloading app bytes
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools')
          from desktop_source_ci import require_source_ci
          print(json.dumps(require_source_ci(os.environ['GITHUB_REPOSITORY'], os.environ['SOURCE_COMMIT'], os.environ['CANDIDATE_RUN_ID'], verification_run_id=os.environ.get('VERIFICATION_RUN_ID') or None)))
          PY
      - uses: actions/download-artifact@v4
        with:
          name: rieke-desktop-macos-arm64
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/testing-candidate
      - name: Verify and publish the exact testing archive
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd().resolve()
          notes = (root / os.environ['NOTES_PATH']).resolve(strict=True)
          if not notes.is_relative_to(root / 'release-evidence') or notes.suffix != '.md':
              raise SystemExit('Notes must be reviewed Markdown under release-evidence')
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'testing-candidate'
          descriptor = json.loads((directory / 'desktop-release.json').read_text())
          if descriptor['source_commit'] != os.environ['SOURCE_COMMIT']:
              raise SystemExit('Downloaded candidate source differs')
          name = descriptor['archive']['filename']
          if pathlib.Path(name).name != name:
              raise SystemExit('Invalid archive filename')
          archive = directory / name
          digest = hashlib.sha256()
          with archive.open('rb') as stream:
              for block in iter(lambda: stream.read(1024 * 1024), b''): digest.update(block)
          if digest.hexdigest() != descriptor['archive']['sha256']:
              raise SystemExit('Downloaded archive hash differs')
          extracted = directory / 'extracted'
          subprocess.run(['ditto', '-x', '-k', str(archive), str(extracted)], check=True)
          app = extracted / 'Disco.app'
          runtime = app / 'Contents/Resources/runtime'
          audit = directory / 'publication-audit'
          audit.mkdir()
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          manifest_file = runtime / 'runtime-manifest.json'
          manifest = json.loads(manifest_file.read_text())
          if manifest['source_commit'] != os.environ['SOURCE_COMMIT'] or manifest['source_dirty'] is not False:
              raise SystemExit('Extracted app source differs from the qualified source')
          helper = runtime / 'native/libdisco_trace_inflate.dylib'
          native_build = json.loads((runtime / 'native/trace-inflate-build.json').read_text())
          native_source = subprocess.check_output(['git', 'show', os.environ['SOURCE_COMMIT'] + ':desktop/native/trace_inflate.c'])
          if native_build.get('source_sha256') != hashlib.sha256(native_source).hexdigest():
              raise SystemExit('Native trace helper build source differs')
          checks = [
              ('signature', ['/usr/bin/codesign', '--verify', '--deep', '--strict', str(app)]),
              ('runtime', [sys.executable, '-B', str(root / 'tools/desktop_runtime_manifest.py'), '--runtime', str(runtime)]),
              ('native', [sys.executable, '-B', str(root / 'tools/desktop_native_compatibility.py'), '--bundle', str(app), '--output', str(audit / 'full-bundle-native.json')]),
              ('trace-symbols', ['/usr/bin/nm', '-gU', str(helper)]),
          ]
          for label, command in checks:
              result = subprocess.run(command, capture_output=True, text=True)
              (audit / (label + '.log')).write_text(result.stdout + result.stderr)
              if result.returncode:
                  raise SystemExit('Extracted candidate failed ' + label + ' verification')
              if label == 'trace-symbols' and '_disco_trace_extract_foreground_v1' not in result.stdout.split():
                  raise SystemExit('Packaged foreground trace entry is missing')
          (audit / 'identity.json').write_text(json.dumps({
              'source_commit': manifest['source_commit'],
              'publisher_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'candidate_run_id': os.environ['CANDIDATE_RUN_ID'],
              'verification_run_id': os.environ.get('VERIFICATION_RUN_ID') or None,
              'archive_sha256': digest.hexdigest(), 'runtime_manifest_sha256': sha(manifest_file),
              'asar_sha256': sha(app / 'Contents/Resources/app.asar'),
              'native_helper_sha256': sha(helper), 'native_source_sha256': native_build['source_sha256'],
              'read_only_artifact_checks': [label for label, _ in checks],
          }, indent=2) + '\n')
          sys.path.insert(0, str(root / 'tools'))
          from desktop_test_release import publish
          proof = publish(extracted / 'Disco.app', archive, directory / 'desktop-release.json', notes, os.environ['CANDIDATE_RUN_ID'], verification_run_id=os.environ.get('VERIFICATION_RUN_ID') or None)
          (directory / 'publication.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testing-publication-proof
          path: |
            ${{ runner.temp }}/testing-candidate/publication.json
            ${{ runner.temp }}/testing-candidate/publication-audit/
          if-no-files-found: error
