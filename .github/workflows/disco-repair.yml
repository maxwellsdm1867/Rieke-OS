name: Disco repair
on:
  workflow_run:
    workflows: [Disco integration]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Current failed integration run to recover, or leave empty to check credentials
        type: string
        required: false
permissions: {}
concurrency:
  group: disco-repair-${{ github.event.workflow_run.head_branch || inputs.run_id || 'credentials' }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.repository == 'maxwellsdm1867/Rieke-OS' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.DISCO_HOSTED_REPAIR == 'enabled' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) &&
        contains(fromJSON('["success","failure","timed_out","startup_failure","action_required"]'), github.event.workflow_run.conclusion)))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
      issues: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      run: ${{ steps.plan.outputs.run }}
      attempt: ${{ steps.plan.outputs.attempt }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the current integration event
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id || inputs.run_id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          GREEN: ${{ github.event.workflow_run.conclusion == 'success' }}
        run: |
          set -euo pipefail
          if [[ -z "$RUN" ]]; then
            echo 'action=credentials' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$RUN" =~ ^[1-9][0-9]*$ ]]
          if [[ -z "$ATTEMPT" ]]; then
            ATTEMPT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .run_attempt)
          fi
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "attempt=$ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$GREEN" == true ]]; then
            echo 'action=reconcile' >> "$GITHUB_OUTPUT"
          else
            python3 -B tools/disco_repair_publish.py plan --run-id "$RUN" --attempt "$ATTEMPT" > "$RUNNER_TEMP/plan.json"
            action=$(jq -er .action "$RUNNER_TEMP/plan.json")
            case "$action" in
              generate)
                head=$(jq -er .head_sha "$RUNNER_TEMP/plan.json")
                [[ "$head" =~ ^[0-9a-f]{40}$ ]]
                echo "head=$head" >> "$GITHUB_OUTPUT" ;;
              exhausted|stale) ;;
              *) exit 1 ;;
            esac
            echo "action=$action" >> "$GITHUB_OUTPUT"
          fi

  credentials:
    needs: plan
    if: needs.plan.outputs.action == 'credentials'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Verify hosted credentials without generating or publishing a patch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.DISCO_REPAIR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'Missing OPENAI_API_KEY'; exit 1; }
          test -n "$GH_TOKEN" || { echo 'Missing DISCO_REPAIR_PUSH_TOKEN'; exit 1; }
          curl --fail --silent --show-error --max-time 30 --output /dev/null \
            -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models
          gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' | grep -qx true
          echo 'OpenAI accepted the project credential and GitHub recognized push access to Disco.' >> "$GITHUB_STEP_SUMMARY"

  generate:
    needs: plan
    if: needs.plan.outputs.action == 'generate'
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      statuses: read
    uses: ./.github/workflows/disco-repair-generate.yml
    with:
      failed_run_id: ${{ needs.plan.outputs.run }}
      head_sha: ${{ needs.plan.outputs.head }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  publish:
    needs: [plan, generate]
    if: needs.generate.outputs.has_patch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
      statuses: write
    outputs:
      applied: ${{ steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read the sole patch from this repair attempt
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/disco_repair_publish.py fetch --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --patch "$RUNNER_TEMP/codex.patch"
      - name: Apply a validated patch to the current revision
        if: steps.download.outcome == 'success'
        id: publish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISCO_REPAIR_PUSH_TOKEN: ${{ secrets.DISCO_REPAIR_PUSH_TOKEN }}
          RUN: ${{ needs.plan.outputs.run }}
          ATTEMPT: ${{ needs.plan.outputs.attempt }}
        run: python3 -B tools/disco_repair_publish.py publish --run-id "$RUN" --attempt "$ATTEMPT" --patch "$RUNNER_TEMP/codex.patch"

  handoff:
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.action == 'reconcile' || needs.plan.outputs.action == 'exhausted' ||
       (needs.plan.outputs.action == 'generate' && needs.publish.outputs.applied != 'true'))
    needs: [plan, generate, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      statuses: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve a green repair or assign one final blocker
        env:
          GH_TOKEN: ${{ github.token }}
          DISCO_REPAIR_PUSH_TOKEN: ${{ needs.plan.outputs.action == 'reconcile' && secrets.DISCO_REPAIR_PUSH_TOKEN || '' }}
          RUN: ${{ needs.plan.outputs.run }}
          ATTEMPT: ${{ needs.plan.outputs.attempt }}
          ACTION: ${{ needs.plan.outputs.action }}
          PATCH: ${{ needs.generate.outputs.has_patch }}
        run: |
          if [[ "$ACTION" == reconcile ]]; then
            python3 -B tools/disco_repair_publish.py reconcile --run-id "$RUN" --attempt "$ATTEMPT"
          else
            reason=generation
            if [[ "$ACTION" == exhausted ]]; then reason=exhausted; elif [[ "$PATCH" == true ]]; then reason=publication; fi
            python3 -B tools/disco_repair_publish.py escalate --run-id "$RUN" --attempt "$ATTEMPT" --reason "$reason"
          fi
