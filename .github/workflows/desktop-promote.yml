name: Promote qualified Rieke OS desktop
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed stable tag
        required: true
      candidate_run_id:
        description: Successful desktop-candidate run containing the exact qualified artifacts
        required: true
      evidence_path:
        description: Reviewed qualification JSON committed to the default branch
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  # All stable versions share a lock; an older build cannot race a newer promotion.
  group: rieke-desktop-stable-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: github.repository == 'maxwellsdm1867/Rieke-OS'
    runs-on: macos-15
    # Repository owners must enable required reviewers here. YAML alone does not.
    environment: desktop-publishing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - run: npm ci --ignore-scripts
        working-directory: desktop
      - name: Require a successful canonical candidate run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          run_id = os.environ['CANDIDATE_RUN']
          if not re.fullmatch(r'\d+', run_id): raise SystemExit('Invalid candidate run ID')
          receipt = json.loads(subprocess.check_output(['gh','api',f'repos/maxwellsdm1867/Rieke-OS/actions/runs/{run_id}'],text=True))
          if receipt['conclusion'] != 'success' or receipt['path'] != '.github/workflows/desktop-candidate.yml':
              raise SystemExit('Candidate must be a successful desktop build')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: rieke-desktop-macos-arm64
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: desktop/dist
      - name: Verify reviewed evidence, recover draft uploads, and promote exact bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          EVIDENCE_PATH: ${{ inputs.evidence_path }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          evidence = (root / os.environ['EVIDENCE_PATH']).resolve(strict=True)
          if not evidence.is_relative_to(root / 'release-evidence') or evidence.suffix != '.json':
              raise SystemExit('Evidence must be a reviewed release-evidence JSON in this checkout')
          subprocess.run(['python3','tools/desktop_release.py','promote','--tag',os.environ['RELEASE_TAG'],'--evidence',str(evidence)],check=True)
          PY
