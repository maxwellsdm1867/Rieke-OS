name: Disco desktop candidate
on:
  push:
    tags: ['v*', 'desktop-test-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Exact reviewed version tag in Disco
        required: true
      signed:
        description: Require Developer ID signing and notarization
        type: boolean
        default: false
      extended_qualification:
        description: Also run native update/restore/rollback and fault-injection audits
        type: boolean
        default: false
      candidate_run_id:
        description: Optional existing candidate run to verify without rebuilding
        required: false
      check_suite:
        description: Focused check for a saved candidate only
        type: choice
        default: auto
        options: [auto, smoke, updater, database, packaging, ui]
      compare_ref:
        description: Optional ancestor release baseline; defaults to previous release tag
        required: false
      qualification_ref:
        description: Optional reviewed test-only revision; defaults to this workflow revision
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: rieke-desktop-candidate-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  plan:
    if: (github.repository == 'maxwellsdm1867/disco' || github.repository == 'maxwellsdm1867/Rieke-OS')
    runs-on: ubuntu-latest
    outputs:
      build_required: ${{ steps.plan.outputs.build_required }}
      checks: ${{ steps.plan.outputs.checks }}
      source_commit: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: candidate-source
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from changes since the previous release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_REF: ${{ inputs.compare_ref }}
          EXTENDED: ${{ inputs.extended_qualification }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CHECK_SUITE: ${{ inputs.check_suite }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/releases.json"
          python3 - <<'PYTAGS'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          tags = [row['tagName'] for row in json.loads((root/'releases.json').read_text()) if not row['isDraft']]
          (root/'published-tags.json').write_text(json.dumps(tags))
          PYTAGS
          args=(--repo candidate-source --published-tags "$RUNNER_TEMP/published-tags.json" --output "$RUNNER_TEMP/release-plan.json" --github-output "$GITHUB_OUTPUT")
          if [ -n "$COMPARE_REF" ]; then args+=(--base "$COMPARE_REF"); fi
          if [ "$EXTENDED" = true ]; then args+=(--extended); fi
          python3 tools/desktop_release_plan.py "${args[@]}"
          python3 - <<'PYPLAN'
          import json, os, re
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP'])/'release-plan.json').read_text())
          candidate = os.environ.get('CANDIDATE_RUN', '')
          requested_suite = os.environ.get('CHECK_SUITE') or 'auto'
          if candidate and not re.fullmatch(r'[1-9][0-9]*', candidate): raise SystemExit('Invalid candidate run ID')
          if requested_suite != 'auto' and not candidate: raise SystemExit('A focused check requires an existing candidate run')
          checks = [{'suite': 'smoke', 'timeout': 8}]
          for flag, suite, timeout in [('updater','updater',60),('database','database',20),('packaging','packaging',20),('full_ui','ui',20)]:
              if plan[flag]: checks.append({'suite': suite, 'timeout': timeout})
          if requested_suite != 'auto':
              checks = [{'suite': requested_suite, 'timeout': {'smoke':8,'updater':60,'database':20,'packaging':20,'ui':20}[requested_suite]}]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('checks='+json.dumps({'include': checks})+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Release check selection\n\n'+plan['reason']+'\n\n')
              out.write('Build required: '+str(plan['build_required'])+'\n\n')
              out.write('Selected checks: '+', '.join(row['suite'] for row in checks)+'\n')
          PYPLAN
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-release-plan
          path: ${{ runner.temp }}/release-plan.json
          retention-days: 30
  build:
    needs: plan
    if: needs.plan.outputs.build_required == 'true' && !inputs.candidate_run_id && (github.repository == 'maxwellsdm1867/disco' || github.repository == 'maxwellsdm1867/Rieke-OS')
    runs-on: macos-15
    timeout-minutes: 45
    environment: ${{ ((github.event_name == 'push' && startsWith(github.ref_name, 'v')) || inputs.signed) && 'desktop-signing' || 'desktop-build' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            workspace-app/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Verify clean canonical source and coordinated versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          SIGNED_BUILD: ${{ (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || inputs.signed }}
        run: |
          test "$(uname -m)" = arm64
          python3 tools/desktop_application_profile.py
          if [ "$SIGNED_BUILD" = true ]; then
            python3 tools/desktop_release.py baseline --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output "$RUNNER_TEMP/desktop-baseline.json"
          else
            python3 tools/desktop_release.py baseline-testing --tag "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" --output "$RUNNER_TEMP/desktop-baseline.json"
          fi
      - run: npm ci
        working-directory: workspace-app
      - name: Validate adopted architecture boundaries
        run: python3 -B tools/architecture_guard.py check
      - run: npm test && npm run build
        working-directory: workspace-app
      - run: npm ci && npm test
        working-directory: desktop
      - name: Assemble the complete portable runtime
        run: python3 tools/desktop_build_runtime.py --skip-frontend
      - name: Verify backend and runtime contracts
        run: |
          desktop/build/runtime/python/bin/python3.11 -m unittest discover -s python/tests -p 'test_*desktop*.py' -v
          desktop/build/runtime/python/bin/python3.11 -m unittest discover -s python/tests -p test_workspace_bootstrap.py -v
          desktop/build/runtime/python/bin/python3.11 -B -m unittest python.tests.test_architecture_guard -v
          desktop/build/runtime/python/bin/python3.11 -B tools/architecture_guard.py test --all --language python
          python3 tools/desktop_runtime_manifest.py
        env:
          PYTHONPATH: python
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Install pinned benchmark Python dependencies
        run: |
          uv venv --python 3.11.13 .rieke-runtime/benchmark-python
          uv pip install --python .rieke-runtime/benchmark-python/bin/python -r benchmarks/requirements-py311.txt
      - name: Run fixed versioned core benchmarks
        run: |
          .rieke-runtime/benchmark-python/bin/python -B tools/benchmark.py run --output benchmarks/results/candidate
          .rieke-runtime/benchmark-python/bin/python -B tools/benchmark.py gate benchmarks/results/candidate/benchmark.json --commit "$(git rev-parse HEAD)" --app-version "$(node -p "require('./rieke-release.json').version")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-benchmark-diagnostics
          path: benchmarks/results/candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Prepare packaging filesystem retries
        run: |
          node - <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const graceful = require.resolve('graceful-fs', {paths: [path.resolve('desktop')]});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'rieke-packaging-fs.cjs'),
            `require(${JSON.stringify(graceful)}).gracefulify(require('node:fs'));\n`);
          NODE
      - name: Build unsigned local qualification candidate
        id: unsigned_package
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref_name, 'v')) && !inputs.signed }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # Queue EMFILE/ENFILE retries before osx-sign captures fs.open.
          NODE_OPTIONS="--require=$RUNNER_TEMP/rieke-packaging-fs.cjs" npm run dist
      - name: Build signed and notarized candidate
        id: signed_package
        if: (github.event_name == 'push' && startsWith(github.ref_name, 'v')) || inputs.signed
        working-directory: desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          node -e "if(require('./distribution.json').channel!=='signed')throw new Error('Commit the reviewed signed distribution policy before building a signed release')"
          test -n "$CSC_LINK"
          test -n "$CSC_KEY_PASSWORD"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER"
          NODE_OPTIONS="--require=$RUNNER_TEMP/rieke-packaging-fs.cjs" npm run dist
          codesign --verify --deep --strict 'dist/mac-arm64/Disco.app'
          spctl --assess --type execute 'dist/mac-arm64/Disco.app'
          xcrun stapler validate 'dist/mac-arm64/Disco.app'
      - name: Create exact-byte unsigned release metadata
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref_name, 'v')) && !inputs.signed }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          python3 tools/desktop_test_release.py --app 'desktop/dist/mac-arm64/Disco.app' --archive "desktop/dist/Disco-${VERSION}-arm64.zip" --output desktop/dist/desktop-release.json
      - name: Inventory exact candidate bytes
        id: candidate_inventory
        run: |
          python3 tools/desktop_release.py inventory --output desktop/dist/artifacts.json
          cp "$RUNNER_TEMP/desktop-baseline.json" desktop/dist/desktop-baseline.json
          cp benchmarks/results/candidate/benchmark.json benchmarks/results/candidate/benchmark.md desktop/dist/
          cp desktop/build/runtime/runtime-audit.json desktop/dist/runtime-audit.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.candidate_inventory.outcome == 'success'
        with:
          name: rieke-desktop-macos-arm64
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.blockmap
            desktop/dist/latest-mac.yml
            desktop/dist/artifacts.json
            desktop/dist/desktop-baseline.json
            desktop/dist/benchmark.json
            desktop/dist/benchmark.md
            desktop/dist/runtime-audit.json
            desktop/dist/desktop-release.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Verify ${{ matrix.suite }}
    needs: [plan, build]
    if: >-
      !cancelled() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' ||
       (needs.build.result == 'skipped' && inputs.candidate_run_id != ''))
    runs-on: macos-15
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualification_ref || github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          path: desktop/build/candidate-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: desktop/build/candidate-source/desktop/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Use the candidate's pinned dependencies and implementation
        run: |
          for source in desktop/build/candidate-source/desktop/*.cjs; do
            cmp "$source" "desktop/$(basename "$source")"
          done
          cmp desktop/e2e/helpers.cjs desktop/build/candidate-source/desktop/e2e/helpers.cjs
          cmp desktop/package-lock.json desktop/build/candidate-source/desktop/package-lock.json
          npm ci --prefix desktop/build/candidate-source/desktop
          ln -s "$GITHUB_WORKSPACE/desktop/build/candidate-source/desktop/node_modules" desktop/node_modules
      - name: Validate the saved candidate run
        if: inputs.candidate_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-run.json"
          python3 - <<'PYRUN'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP'])/'candidate-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert run['path'] == '.github/workflows/desktop-candidate.yml'
          assert run['status'] == 'completed', 'Do not consume an active candidate run'
          PYRUN
      - uses: actions/download-artifact@v4
        with:
          name: rieke-desktop-macos-arm64
          path: desktop/dist
          run-id: ${{ inputs.candidate_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify saved candidate identity and extract the same app
        env:
          EXPECTED_SOURCE: ${{ needs.plan.outputs.source_commit }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id || github.run_id }}
          CHECK_SUITE: ${{ matrix.suite }}
        run: |
          uv run --no-project --python 3.11.13 python - <<'PYVERIFY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          dist = Path('desktop/dist')
          baseline = json.loads((dist/'desktop-baseline.json').read_text())
          assert baseline['source_commit'] == os.environ['EXPECTED_SOURCE']
          inventory = json.loads((dist/'artifacts.json').read_text())['artifacts']
          for name, expected in inventory.items():
              assert Path(name).name == name
              file = dist/name
              assert file.is_file() and not file.is_symlink()
              assert file.stat().st_size == expected['size']
              with file.open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == expected['sha256']
          version = baseline['application_version']
          archive = dist/f'Disco-{version}-arm64.zip'
          assert archive.name in inventory
          # Generated and checksummed by the trusted build job in this same run.
          destination = dist/'mac-arm64'
          destination.mkdir()
          subprocess.run(['ditto','-x','-k',str(archive),str(destination)], check=True)
          app = destination/'Disco.app'
          runtime = app/'Contents/Resources/runtime'
          manifest = json.loads((runtime/'runtime-manifest.json').read_text())
          assert manifest['source_commit'] == baseline['source_commit'] and manifest['source_dirty'] is False
          assert manifest['application_version'] == version
          subprocess.run(['codesign','--verify','--deep','--strict',str(app)], check=True)
          provenance = {'format':'rieke-desktop-verification', 'source_commit':baseline['source_commit'],
                        'harness_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                        'candidate_run_id':os.environ['CANDIDATE_RUN'], 'suite':os.environ['CHECK_SUITE'],
                        'artifacts':inventory}
          output = Path('docs/dev/desktop-verification-provenance.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(provenance, indent=2)+'\n')
          PYVERIFY
      - name: Packaged launch, project persistence, update check and orderly quit
        if: matrix.suite == 'smoke'
        env:
          RIEKE_SMOKE_REQUIRE_UPDATE_CONNECTIVITY: '1'
        run: node desktop/e2e/smoke.e2e.cjs
      - name: Native updater and user-driven download checks
        if: matrix.suite == 'updater'
        run: |
          npm run test:e2e:updater --prefix desktop
          CHANNEL=$(node -p "require('./desktop/build/candidate-source/desktop/distribution.json').channel")
          if [ "$CHANNEL" = unsigned-testing ]; then
            node desktop/e2e/github-updates.e2e.cjs
            node desktop/e2e/testing-upgrade.e2e.cjs
          fi
      - name: Real native database lifecycle and logical transfer
        if: matrix.suite == 'database'
        run: |
          uv run --no-project --python 3.11.13 python - <<'PYDATABASE'
          import json, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from desktop_artifact_e2e import isolated_database_probe
          resources = Path('desktop/dist/mac-arm64/Disco.app/Contents/Resources').resolve()
          with tempfile.TemporaryDirectory(prefix='rieke-release-database-') as scratch:
              result = isolated_database_probe(resources, Path(scratch))
          output = Path('docs/dev/desktop-native-database-e2e.json')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({'passed': True, 'probe': result}, indent=2)+'\n')
          PYDATABASE
      - name: Installer, runtime and startup fault checks
        if: matrix.suite == 'packaging'
        run: |
          CHANNEL=$(node -p "require('./desktop/build/candidate-source/desktop/distribution.json').channel")
          if [ "$CHANNEL" = unsigned-testing ]; then
            node desktop/e2e/bootstrap.e2e.cjs
            uv run --no-project --python 3.11.13 python tools/desktop_artifact_e2e.py --installed 'desktop/dist/mac-arm64/Disco.app' --output docs/dev/desktop-artifact-e2e.json
          fi
          node desktop/e2e/backend-failure.e2e.cjs
      - name: Extended packaged UI regression
        if: matrix.suite == 'ui'
        run: node desktop/e2e/packaged.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.suite }}
          path: |
            docs/dev/desktop-verification-provenance.json
            docs/dev/desktop-smoke-e2e.json
            docs/dev/desktop-updater-client-e2e.json
            docs/dev/desktop-ui-e2e/
            docs/dev/desktop-artifact-e2e.json
            docs/dev/desktop-native-database-e2e.json
            docs/dev/desktop-testing-upgrade-e2e.json
            desktop/build/native-qualification-diagnostics/
          if-no-files-found: warn
          retention-days: 30
