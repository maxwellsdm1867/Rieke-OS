name: Diagnostic split click frame phase (not qualification)
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Unused compatibility input; immutable sources pinned below
        required: false
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned runtime
        run: |
          uv venv --python 3.11.13 "$RUNNER_TEMP/diagnostic-python"
          uv pip install --python "$RUNNER_TEMP/diagnostic-python/bin/python" -r benchmarks/requirements-py311.txt
          npm ci --prefix workspace-app
          npm ci --prefix desktop --ignore-scripts
          desktop/node_modules/.bin/playwright install --with-deps chromium
      - name: Bind immutable product sources
        run: |
          git worktree add --detach "$RUNNER_TEMP/source-pinned" a16c915f9730384af3285949bb962d12707ccf01
          git worktree add --detach "$RUNNER_TEMP/source-candidate" d9bec2801460b73c01a3e6e879a73bf390cee21b
          printf '/workspace-app/node_modules\n/desktop/node_modules\n' >> "$(git rev-parse --git-path info/exclude)"
          for source in pinned candidate; do
            for package in workspace-app desktop; do
              "$RUNNER_TEMP/diagnostic-python/bin/python" -B tools/benchmark_workflow.py dependencies-match "$RUNNER_TEMP/source-$source/$package/package-lock.json" "$GITHUB_WORKSPACE/$package/package-lock.json"
              ln -s "$GITHUB_WORKSPACE/$package/node_modules" "$RUNNER_TEMP/source-$source/$package/node_modules"
            done
          done
      - name: Fixed eight-run diagnostic with every sample preserved
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          "$RUNNER_TEMP/diagnostic-python/bin/python" -B - <<'PY'
          import json,os,pathlib,subprocess,time
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);out=temp/'split-diagnostic';out.mkdir();rows=[]
          schedule=[('pinned','task'),('candidate','task'),('pinned','raf'),('candidate','raf'),('candidate','task'),('pinned','task'),('candidate','raf'),('pinned','raf')]
          (out/'plan.json').write_text(json.dumps({'diagnostic_only':True,'sources':{'pinned':'a16c915f9730384af3285949bb962d12707ccf01','candidate':'d9bec2801460b73c01a3e6e879a73bf390cee21b'},'schedule':schedule,'epochs':1000000,'protocol_epochs':20000,'main_count':19900,'samples_each':3,'note':'Only remove-split launch phase differs. Original setup sequence and all measured correctness preserved; remaining inventory explicitly incomplete, so canonical run receipt must refuse qualification.'},indent=2))
          for i,(role,mode) in enumerate(schedule,1):
              run=out/f'run-{i}-{role}-{mode}';command=[str(temp/'diagnostic-python/bin/python'),'-B','tools/benchmark_workflow.py','run','--source-root',str(temp/('source-'+role)),'--output',str(run),'--protocol-epochs','20000']
              with (out/f'run-{i}.log').open('w') as log: result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,env={**os.environ,'DISCO_SPLIT_LAUNCH':mode})
              row={'run':i,'role':role,'mode':mode,'canonical_exit':result.returncode,'diagnostic_completed':False};rows.append(row)
              try:
                  receipt=json.loads((run/'receipt.json').read_text());browser=json.loads((run/'browser/browser.json').read_text());meta=json.loads((run/'server/server.json').read_text())
                  samples=[json.loads((run/f'browser/split-diagnostic-sample-{n}.json').read_text()) for n in range(3)]
                  assert receipt['status']=='failed' and browser['status']=='incomplete' and not browser['failures']
                  assert receipt['source_start']==receipt['source_end'] and not receipt['source_start']['status']
                  assert meta['epochs']==1000000 and meta['protocol_epochs']==20000 and meta['main_count']==19900
                  assert all(s['result']['correctness']['passed'] and len(s['result']['requests'])==1 for s in samples)
                  assert receipt['cleanup']['browser_processes_closed'] and receipt['cleanup']['server_processes_closed']
                  row.update(diagnostic_completed=True,totals=[s['result']['total_ms'] for s in samples],observer=[s['result']['observer'] for s in samples])
              except Exception as error:row['error']=str(error)
              (out/'run-status.json').write_text(json.dumps(rows,indent=2));print(json.dumps(row),flush=True)
          if not all(row['diagnostic_completed'] for row in rows):raise SystemExit('Incomplete diagnostic execution; preserve all evidence')
          PY
      - name: Collect compact evidence
        if: always()
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP']);source=root/'split-diagnostic';out=root/'split-compact';out.mkdir()
          for file in source.rglob('*'):
              if file.is_file() and (file.name in ['plan.json','run-status.json','receipt.json'] or file.name.startswith('split-diagnostic-sample-')):
                  target=out/file.relative_to(source);target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(file,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-phase-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/split-compact/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-phase-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/split-diagnostic/
            !${{ runner.temp }}/split-diagnostic/**/node_modules/**
            !${{ runner.temp }}/split-diagnostic/**/production-entry/src/**
          retention-days: 30
