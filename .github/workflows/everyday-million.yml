name: Everyday million query and workflow regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Optional full SHA for the previous-iteration comparison; pinned regression baseline stays fixed'
        required: false
        type: string
      candidate_sha:
        description: 'Optional diagnostic application SHA; does not qualify the workflow revision for publication'
        required: false
        type: string

permissions:
  contents: read

# Only superseded automatic PR runs cancel. Push and explicit qualification runs
# have distinct groups and retain their full evidence even when new work arrives.
concurrency:
  group: everyday-million-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Select performance check scope
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.plan.outputs.documentation_only }}
      harness: ${{ steps.sources.outputs.harness }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--all)
          if [ "$EVENT_NAME" != workflow_dispatch ] && [ -n "$BASE_REF" ] && [ "$BASE_REF" != 0000000000000000000000000000000000000000 ]; then args=(--base "$BASE_REF"); fi
          python3 -B tools/architecture_guard.py check --language metadata
          python3 -B tools/architecture_guard.py plan "${args[@]}" --github-output "$GITHUB_OUTPUT" --output "$RUNNER_TEMP/performance-scope.json"
      - id: sources
        if: steps.plan.outputs.documentation_only != 'true'
        env:
          PINNED_SHA: 34ce2e06dec0e2886d5a2310f21e02cf818cb646
          PREVIOUS_SHA: ${{ inputs.baseline_sha || github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 -B tools/benchmark_ci.py resolve --pinned "$PINNED_SHA" --previous "$PREVIOUS_SHA" \
            --candidate "$REQUESTED_CANDIDATE_SHA" --event "$EVENT_NAME" \
            --output "$RUNNER_TEMP/source-plan.json" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-check-scope
          path: ${{ runner.temp }}/performance-scope.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.sources.outcome == 'success'
        with:
          name: performance-source-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-plan.json
          if-no-files-found: error

  backend:
    name: Backend million query regression
    needs: scope
    if: needs.scope.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize backend failure diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/everyday-backend"
          printf 'Backend preparation started; missing receipts do not qualify.\n' > "$RUNNER_TEMP/everyday-backend/backend-start.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.harness }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: performance-source-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-plan
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned benchmark runtime
        run: |
          uv venv --python 3.11.13 "$RUNNER_TEMP/everyday-python"
          uv pip install --python "$RUNNER_TEMP/everyday-python/bin/python" -r benchmarks/requirements-py311.txt
      - name: Validate backend and scheduling harnesses
        run: |
          mkdir -p "$RUNNER_TEMP/everyday-backend"
          test -f python/tests/test_benchmark_everyday.py
          test -f python/tests/test_benchmark_ci.py
          "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s python/tests -p test_benchmark_everyday.py -v 2>&1 | tee "$RUNNER_TEMP/everyday-backend/everyday-harness-tests.log"
          "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s python/tests -p test_benchmark_ci.py -v 2>&1 | tee "$RUNNER_TEMP/everyday-backend/scheduling-tests.log"
      - name: Measure each distinct backend source serially on this runner
        run: |
          unset RIEKE_TEST_DOM_MODULE
          "$RUNNER_TEMP/everyday-python/bin/python" -B tools/benchmark_ci.py run --family backend \
            --plan "$RUNNER_TEMP/performance-plan/source-plan.json" --output "$RUNNER_TEMP/everyday-backend" \
            --worktrees "$RUNNER_TEMP/backend-sources"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everyday-backend/
          if-no-files-found: error
          retention-days: 30

  browser:
    name: Browser million workflow regression
    needs: scope
    if: needs.scope.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Initialize browser failure diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/everyday-browser"
          printf 'Browser preparation started; missing receipts do not qualify.\n' > "$RUNNER_TEMP/everyday-browser/browser-start.txt"
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.harness }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: performance-source-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-plan
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: workspace-app/package-lock.json
      - name: Install committed frontend and browser dependencies
        run: |
          npm ci --prefix workspace-app
          npm ci --prefix desktop --ignore-scripts
          desktop/node_modules/.bin/playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned benchmark runtime
        run: |
          uv venv --python 3.11.13 "$RUNNER_TEMP/everyday-python"
          uv pip install --python "$RUNNER_TEMP/everyday-python/bin/python" -r benchmarks/requirements-py311.txt
      - name: Validate browser, core and timing harnesses
        run: |
          mkdir -p "$RUNNER_TEMP/everyday-browser"
          test -f python/tests/test_benchmark.py
          test -f python/tests/test_benchmark_workflow.py
          test -f python/tests/test_benchmark_workflow_backend.py
          test -f python/tests/test_operation_timing.py
          test -f benchmarks/workflow/browser-readiness.test.mjs
          node --test benchmarks/workflow/browser-readiness.test.mjs 2>&1 | tee "$RUNNER_TEMP/everyday-browser/workflow-readiness-tests.log"
          "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s python/tests -p test_benchmark.py -v 2>&1 | tee "$RUNNER_TEMP/everyday-browser/core-harness-tests.log"
          "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s python/tests -p test_benchmark_workflow.py -v 2>&1 | tee "$RUNNER_TEMP/everyday-browser/workflow-harness-tests.log"
          PYTHONPATH=python "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s python/tests -p test_benchmark_workflow_backend.py -v 2>&1 | tee "$RUNNER_TEMP/everyday-browser/workflow-backend-tests.log"
          PYTHONPATH=python "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s python/tests -p test_operation_timing.py -v 2>&1 | tee "$RUNNER_TEMP/everyday-browser/module-timing-tests.log"
      - name: Preflight, core, then each distinct browser source serially
        run: |
          unset RIEKE_TEST_DOM_MODULE
          "$RUNNER_TEMP/everyday-python/bin/python" -B tools/benchmark_ci.py run --family browser \
            --plan "$RUNNER_TEMP/performance-plan/source-plan.json" --output "$RUNNER_TEMP/everyday-browser" \
            --worktrees "$RUNNER_TEMP/browser-sources"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: everyday-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everyday-browser/
          if-no-files-found: error
          retention-days: 30

  everyday-million:
    # Keep the required normal check name. Measuring an explicit other source is
    # diagnostic and must not create a green qualification check on this HEAD.
    name: ${{ inputs.candidate_sha != '' && 'Diagnostic million metadata query regression' || 'Actual million metadata query regression' }}
    needs: [scope, backend, browser]
    if: always() && needs.scope.outputs.documentation_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.harness }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: performance-source-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/performance-plan
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: everyday-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everyday-results
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: everyday-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everyday-results
      - name: Require both complete families and all unchanged comparisons
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          python3 -B tools/benchmark_ci.py aggregate --plan "$RUNNER_TEMP/performance-plan/source-plan.json" \
            --output "$RUNNER_TEMP/everyday-results" --backend-result "$BACKEND_RESULT" --browser-result "$BROWSER_RESULT"
      - name: Preserve combined evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: everyday-million-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/everyday-results/
          if-no-files-found: error
          retention-days: 30
