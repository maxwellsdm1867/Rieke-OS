# ISOLATED DIAGNOSTIC BRANCH ONLY. Never merge this replacement into release/main.
name: Disco performance diagnostics ONLY
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trace-frame-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trace-frame-diagnostic:
    name: Diagnostic only — two fixed trace pairs
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE: 61881e87e2fe07f1d317ec92e42827243cfec9fa
      BASELINE: 4de896f2e0b4ea966b5a428c3d2314f93fba935f
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind immutable applications and predeclare experiment
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trace-frame-diagnostic"
          git diff --exit-code "$CANDIDATE" -- benchmarks/registry.json tools/benchmark_prepared_geometry.py tools/benchmark_workflow.py benchmarks/prepared_geometry/observer.mjs benchmarks/workflow/browser.mjs benchmarks/prepared_geometry/fixture.py benchmarks/prepared_geometry/server.py benchmarks/prepared_geometry/build.mjs
          git worktree add --detach "$RUNNER_TEMP/trace-baseline" "$BASELINE"
          git worktree add --detach "$RUNNER_TEMP/trace-candidate" "$CANDIDATE"
          printf '/workspace-app/node_modules\n/desktop/node_modules\n' >> "$(git rev-parse --git-path info/exclude)"
          python3 - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path.cwd(); output=Path(os.environ['RUNNER_TEMP'])/'trace-frame-diagnostic'
          paths=['.github/workflows/everyday-million.yml','benchmarks/prepared_geometry/browser.mjs','benchmarks/prepared_geometry/paired.mjs','benchmarks/prepared_geometry/frame-diagnostic.mjs']
          receipt={'format':'disco-trace-frame-diagnostic-v1','diagnostic_only':True,'qualification':False,'maximum_pairs':2,'samples_per_role':3,
            'order':['B0','C0','C1','B1','B2','C2'],'pairs':[{'name':'aa','baseline':os.environ['CANDIDATE'],'candidate':os.environ['CANDIDATE'],'launch':['baseline','candidate']},{'name':'reversed','baseline':os.environ['BASELINE'],'candidate':os.environ['CANDIDATE'],'launch':['candidate','baseline']}],
            'harness_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'harness_ref':os.environ['GITHUB_REF'],'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],
            'host':{'platform':platform.platform(),'cpus':os.cpu_count()},'instrumentation_caps':{'frames':512,'readiness':128,'visibility':64,'longtasks':128},
            'limits':['Launch-order crossover only, not same-process source crossover','Diagnostic predicate sampling adds overhead','No source, browser flags, warmups, thresholds or oracle changes','No automatic retries; no qualification artifacts'],
            'sha256':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}}
          (output/'predeclared.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact shared dependencies
        run: |
          set -euo pipefail
          uv venv --python 3.11.13 "$RUNNER_TEMP/trace-python"
          uv pip install --python "$RUNNER_TEMP/trace-python/bin/python" -r benchmarks/requirements-py311.txt
          npm ci --prefix workspace-app
          npm ci --prefix desktop --ignore-scripts
          desktop/node_modules/.bin/playwright install chromium
          for source in trace-baseline trace-candidate; do
            for package in workspace-app desktop; do
              dependency_args=()
              if [ "$package" = desktop ]; then dependency_args=(--browser-only); fi
              "$RUNNER_TEMP/trace-python/bin/python" -B tools/benchmark_workflow.py dependencies-match "$RUNNER_TEMP/$source/$package/package-lock.json" "$GITHUB_WORKSPACE/$package/package-lock.json" "${dependency_args[@]}"
              ln -s "$GITHUB_WORKSPACE/$package/node_modules" "$RUNNER_TEMP/$source/$package/node_modules"
            done
            test -z "$(git -C "$RUNNER_TEMP/$source" status --porcelain)"
          done
      - name: Check passive logger and unchanged observation contracts
        run: |
          node --test benchmarks/prepared_geometry/frame-diagnostic.test.mjs benchmarks/prepared_geometry/paired.test.mjs benchmarks/prepared_geometry/observer.test.mjs benchmarks/workflow/browser-readiness.test.mjs
      - name: Execute exactly two fixed diagnostic pairs without sampled retries
        run: |
          set -euo pipefail
          unset RIEKE_TEST_DOM_MODULE PREPARED_GEOMETRY_TIMING PREPARED_GEOMETRY_BROWSER
          for pair in aa reversed; do
            baseline="$RUNNER_TEMP/trace-candidate"
            export DISCO_DIAGNOSTIC_REVERSE_LAUNCH=0
            if [ "$pair" = reversed ]; then
              baseline="$RUNNER_TEMP/trace-baseline"
              export DISCO_DIAGNOSTIC_REVERSE_LAUNCH=1
            fi
            output="$RUNNER_TEMP/trace-frame-diagnostic/$pair"
            # The original comparison MUST refuse diagnostic timing. Exact
            # correctness, source integrity and cleanup are verified below.
            set +e
            "$RUNNER_TEMP/trace-python/bin/python" -B tools/benchmark_prepared_geometry.py pair --baseline-source "$baseline" --source-root "$RUNNER_TEMP/trace-candidate" --output "$output"
            result=$?
            set -e
            "$RUNNER_TEMP/trace-python/bin/python" -B - "$output" "$result" <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()/'tools'))
          import benchmark_prepared_geometry as owner
          path=Path(sys.argv[1]); rows={role:json.loads((path/role/'receipt.json').read_text()) for role in ('baseline','candidate')}
          for row in rows.values(): owner.validate(row,clean=True)
          owner.validate_pair(rows['baseline'],rows['candidate'])
          comparison=json.loads((path/'comparison.json').read_text())
          assert int(sys.argv[2])==1 and comparison=={'status':'failed','error':'Diagnostic geometry timing cannot qualify comparison'},comparison
          report={'diagnostic_only':True,'qualification':False,'status':'complete','exact_correctness':'passed','ordinary_comparator':'refused_diagnostic_timing','roles':{}}
          for role,row in rows.items():
            assert row['environment']['browser']['timing_mode']=='diagnostic'
            report['roles'][role]={'source':row['source_start']['commit'],'cleanup':row['cleanup'],'samples':[{'sample':s['sample_index'],'trace':s['trace'],'breakdown':s['breakdown']} for s in row['samples']]}
            for i in range(3):
              diagnostic=json.loads((path/role/'browser'/f'frame-diagnostic-{i}.json').read_text())
              assert diagnostic['diagnostic_only'] is True and diagnostic['frames'] and diagnostic['readiness']
              assert len(diagnostic['frames'])<=512 and len(diagnostic['readiness'])<=128 and len(diagnostic['visibility'])<=64 and len(diagnostic['longtasks'])<=128
            launch=json.loads((path/role/'browser-process.json').read_text())
            assert isinstance(launch['pid'],int) and launch['args']
          (path/'diagnostic-result.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          done
      - name: Preserve diagnostic-only evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-frame-DIAGNOSTIC-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/trace-frame-diagnostic/predeclared.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/plan.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/diagnostic-result.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/comparison.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/receipt.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/browser-process.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/frame-diagnostic-*.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/samples.jsonl
            ${{ runner.temp }}/trace-frame-diagnostic/**/production-build-receipt.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/cleanup.json
            ${{ runner.temp }}/trace-frame-diagnostic/**/*.log
            ${{ runner.temp }}/trace-frame-diagnostic/**/failure-*
  linux-development-profile:
    name: Diagnostic only — candidate development CPU attribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CANDIDATE: 61881e87e2fe07f1d317ec92e42827243cfec9fa
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Predeclare development-only profile
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --exit-code "$CANDIDATE" -- tools/benchmark_workflow.py tools/benchmark_everyday.py benchmarks/registry.json benchmarks/workflow/browser.mjs benchmarks/workflow/server.py benchmarks/workflow/fixture-app.mjs
          git worktree add --detach "$RUNNER_TEMP/linux-candidate" "$CANDIDATE"
          printf '/workspace-app/node_modules\n/desktop/node_modules\n' >> "$(git rev-parse --git-path info/exclude)"
          mkdir -p "$RUNNER_TEMP/linux-profile"
          python3 - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          root=Path.cwd();out=Path(os.environ['RUNNER_TEMP'])/'linux-profile'
          paths=['tools/benchmark_workflow.py','benchmarks/registry.json','benchmarks/workflow/browser.mjs','benchmarks/workflow/server.py','benchmarks/workflow/backend_timing.py']
          data={'format':'disco-linux-development-profile-v1','diagnostic_only':True,'qualification':False,
            'source':os.environ['CANDIDATE'],'harness':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'workflow_sha':os.environ['GITHUB_WORKFLOW_SHA'],'workflow_ref':os.environ['GITHUB_REF'],
            'epochs':1000000,'protocol_epochs':20000,'ordinary_samples':3,'runtime':'development','profile_passes':1,'maximum_invocations':1,'invocation_timeout_seconds':720,'kill_grace_seconds':30,'job_timeout_minutes':20,
            'purpose':'CPU/module plus passive GC attribution only; development ordinary timings cannot be compared to production CI timings',
            'gc_record_limit_per_request':64,'gc_policy_changes':False,
            'host':{'platform':platform.platform(),'cpus':os.cpu_count()},'sha256':{name:hashlib.sha256((root/name).read_bytes()).hexdigest() for name in paths}}
          (out/'predeclared.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - name: Install exact existing workflow runtime
        run: |
          set -euo pipefail
          uv venv --python 3.11.13 "$RUNNER_TEMP/everyday-python"
          uv pip install --python "$RUNNER_TEMP/everyday-python/bin/python" -r benchmarks/requirements-py311.txt
          npm ci --prefix workspace-app
          npm ci --prefix desktop --ignore-scripts
          desktop/node_modules/.bin/playwright install --with-deps chromium
          for package in workspace-app desktop; do
            dependency_args=()
            if [ "$package" = desktop ]; then dependency_args=(--browser-only); fi
            "$RUNNER_TEMP/everyday-python/bin/python" -B tools/benchmark_workflow.py dependencies-match "$RUNNER_TEMP/linux-candidate/$package/package-lock.json" "$GITHUB_WORKSPACE/$package/package-lock.json" "${dependency_args[@]}"
            ln -s "$GITHUB_WORKSPACE/$package/node_modules" "$RUNNER_TEMP/linux-candidate/$package/node_modules"
          done
          test -z "$(git -C "$RUNNER_TEMP/linux-candidate" status --porcelain)"
          test -z "$(git status --porcelain)"
      - name: Check passive GC observer ownership and bounds
        run: |
          "$RUNNER_TEMP/everyday-python/bin/python" -B -m unittest discover -s benchmarks/workflow -p test_backend_timing_diagnostic.py -q
      - name: Run one fixed development attribution pass
        run: |
          set -euo pipefail
          unset RIEKE_TEST_DOM_MODULE PREPARED_GEOMETRY_TIMING PREPARED_GEOMETRY_BROWSER
          timeout --signal=INT --kill-after=30s 12m "$RUNNER_TEMP/everyday-python/bin/python" -B tools/benchmark_workflow.py run --source-root "$RUNNER_TEMP/linux-candidate" --output "$RUNNER_TEMP/linux-profile/candidate" --protocol-epochs 20000 --runtime development --profile 2>&1 | tee "$RUNNER_TEMP/linux-profile/invocation.log"
      - name: Preserve development-only diagnostics, including partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-development-DIAGNOSTIC-ONLY-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/linux-profile/predeclared.json
            ${{ runner.temp }}/linux-profile/invocation.log
            ${{ runner.temp }}/linux-profile/candidate/receipt.json
            ${{ runner.temp }}/linux-profile/candidate/workflow.md
            ${{ runner.temp }}/linux-profile/candidate/workflow.html
            ${{ runner.temp }}/linux-profile/candidate/*.log
            ${{ runner.temp }}/linux-profile/candidate/browser/browser.json
            ${{ runner.temp }}/linux-profile/candidate/browser/*.json
            ${{ runner.temp }}/linux-profile/candidate/browser/*.jsonl
            ${{ runner.temp }}/linux-profile/candidate/browser/*.log
            ${{ runner.temp }}/linux-profile/candidate/browser/*.txt
            ${{ runner.temp }}/linux-profile/candidate/browser/*.png
            ${{ runner.temp }}/linux-profile/candidate/server/requests.jsonl
            ${{ runner.temp }}/linux-profile/candidate/server/server.json
            ${{ runner.temp }}/linux-profile/candidate/server/cleanup.json
