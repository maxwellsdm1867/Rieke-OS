name: Diagnostic hosted trace frames (not release qualification)
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Unused compatibility input; sources are hard pinned below
        required: false
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - name: Install identical pinned runtime
        run: |
          uv venv --python 3.11.13 "$RUNNER_TEMP/trace-python"
          uv pip install --python "$RUNNER_TEMP/trace-python/bin/python" -r benchmarks/requirements-py311.txt
          npm ci --prefix workspace-app
          npm ci --prefix desktop --ignore-scripts
          desktop/node_modules/.bin/playwright install chromium
      - name: Bind immutable product sources and preserve diagnostic plan
        run: |
          mkdir -p "$RUNNER_TEMP/frame-diagnostic"
          git worktree add --detach "$RUNNER_TEMP/trace-baseline" 4de896f2e0b4ea966b5a428c3d2314f93fba935f
          git worktree add --detach "$RUNNER_TEMP/trace-candidate" f8488b95157be906e5bad63272a1d5a131805c47
          printf '/workspace-app/node_modules\n/desktop/node_modules\n' >> "$(git rev-parse --git-path info/exclude)"
          for source in trace-baseline trace-candidate; do
            for package in workspace-app desktop; do
              "$RUNNER_TEMP/trace-python/bin/python" -B tools/benchmark_workflow.py dependencies-match "$RUNNER_TEMP/$source/$package/package-lock.json" "$GITHUB_WORKSPACE/$package/package-lock.json"
              ln -s "$GITHUB_WORKSPACE/$package/node_modules" "$RUNNER_TEMP/$source/$package/node_modules"
            done
          done
          git rev-parse HEAD > "$RUNNER_TEMP/frame-diagnostic/harness-commit.txt"
      - name: Fixed twelve-run browser-mode crossover diagnostic with unchanged correctness oracles
        env:
          PREPARED_GEOMETRY_TIMING: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,time
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);out=temp/'frame-diagnostic'
          plan={'diagnostic_only':True,'order':['baseline','candidate','candidate','baseline'],'runs':12,'browser_modes':['shell','chromium-headless','chromium-headed'],'samples_each':3,'baseline':'4de896f2e0b4ea966b5a428c3d2314f93fba935f','candidate':'f8488b95157be906e5bad63272a1d5a131805c47','instrumentation':'Symmetric CDP CPU/tasks/layout/GC/RAF and existing Server-Timing. No release comparison or qualification; retain all attempts, never retry within this block.'}
          (out/'plan.json').write_text(json.dumps(plan,indent=2));rows=[]
          schedule=[(mode,arm) for arm in plan['order'] for mode in plan['browser_modes']]
          plan['schedule']=schedule;(out/'plan.json').write_text(json.dumps(plan,indent=2))
          for i,(mode,arm) in enumerate(schedule,1):
              command=[str(temp/'trace-python/bin/python'),'-B','tools/benchmark_prepared_geometry.py','run','--source-root',str(temp/('trace-'+arm)),'--output',str(out/f'run-{i}-{mode}-{arm}')]
              row={'run':i,'arm':arm,'browser_mode':mode,'command':command,'started':time.time()}
              with (out/f'run-{i}.log').open('w') as log:
                  result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,env={**os.environ,'DISCO_DIAGNOSTIC_BROWSER_MODE':mode})
              row.update(exit=result.returncode,finished=time.time());rows.append(row)
              (out/'run-status.json').write_text(json.dumps(rows,indent=2));print(row,flush=True)
          if any(row['exit'] for row in rows):raise SystemExit('Diagnostic execution failed; retain partial evidence')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-hosted-frames-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frame-diagnostic/
          retention-days: 30
