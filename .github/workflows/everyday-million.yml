name: Diagnostic hosted trace frames (not release qualification)
on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Unused compatibility input; sources are hard pinned below
        required: false
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - name: Install identical pinned runtime
        run: |
          uv venv --python 3.11.13 "$RUNNER_TEMP/trace-python"
          uv pip install --python "$RUNNER_TEMP/trace-python/bin/python" -r benchmarks/requirements-py311.txt
          npm ci --prefix workspace-app
          npm ci --prefix desktop --ignore-scripts
          desktop/node_modules/.bin/playwright install chromium
      - name: Bind immutable product sources and preserve diagnostic plan
        run: |
          mkdir -p "$RUNNER_TEMP/frame-diagnostic"
          git worktree add --detach "$RUNNER_TEMP/trace-baseline" 4de896f2e0b4ea966b5a428c3d2314f93fba935f
          git worktree add --detach "$RUNNER_TEMP/trace-candidate" f8488b95157be906e5bad63272a1d5a131805c47
          printf '/workspace-app/node_modules\n/desktop/node_modules\n' >> "$(git rev-parse --git-path info/exclude)"
          for source in trace-baseline trace-candidate; do
            for package in workspace-app desktop; do
              "$RUNNER_TEMP/trace-python/bin/python" -B tools/benchmark_workflow.py dependencies-match "$RUNNER_TEMP/$source/$package/package-lock.json" "$GITHUB_WORKSPACE/$package/package-lock.json"
              ln -s "$GITHUB_WORKSPACE/$package/node_modules" "$RUNNER_TEMP/$source/$package/node_modules"
            done
          done
          git rev-parse HEAD > "$RUNNER_TEMP/frame-diagnostic/harness-commit.txt"
      - name: Paired six-context diagnostic with unchanged oracles
        env:
          PREPARED_GEOMETRY_TIMING: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: node benchmarks/prepared_geometry/paired-diagnostic.mjs
      - name: Preserve compact evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/frame-compact"
          cp "$RUNNER_TEMP/frame-diagnostic/plan.json" "$RUNNER_TEMP/frame-compact/" || true
          for arm in baseline candidate; do
            mkdir -p "$RUNNER_TEMP/frame-compact/run-$arm"
            cp "$RUNNER_TEMP/frame-diagnostic/run-$arm/receipt.json" "$RUNNER_TEMP/frame-compact/run-$arm/" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-paired-compact-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frame-compact/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-hosted-frames-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frame-diagnostic/
            !${{ runner.temp }}/frame-diagnostic/**/production-entry/node_modules/**
            !${{ runner.temp }}/frame-diagnostic/**/production-entry/src/**
          retention-days: 30
