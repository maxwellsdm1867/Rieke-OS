name: Verify published desktop package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable unsigned desktop testing release tag
        required: true
      qualification_ref:
        description: Reviewed test-only revision
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'maxwellsdm1867/Rieke-OS'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - uses: astral-sh/setup-uv@v6
      - name: Verify the immutable application source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(uname -m)" = arm64
          case "$RELEASE_TAG" in desktop-test-v*) ;; *) exit 1 ;; esac
          uv run --no-project --python 3.11.13 python tools/desktop_release.py baseline-testing --tag "$RELEASE_TAG" --repository maxwellsdm1867/Rieke-OS --output "$RUNNER_TEMP/published-baseline.json"
      - run: npm ci --prefix desktop
      - name: Download the public release bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          mkdir -p desktop/dist
          gh release download "$RELEASE_TAG" --repo maxwellsdm1867/Rieke-OS --pattern "Rieke-OS-${VERSION}-arm64.zip" --pattern desktop-release.json --dir desktop/dist
      - name: Check archive identity and bounds before extraction
        run: |
          uv run --no-project --python 3.11.13 python - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          d = json.loads(Path('desktop/dist/desktop-release.json').read_text())
          version = json.loads(Path('desktop/package.json').read_text())['version']
          assert d['format'] == 'rieke-desktop-test-release' and d['version'] == 1
          assert d['channel'] == 'unsigned-testing' and d['repository'] == 'maxwellsdm1867/Rieke-OS'
          assert d['source_commit'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert d['source_dirty'] is False and d['production_ready'] is False
          assert d['application_version'] == version and d['platform'] == 'darwin' and d['architecture'] == 'arm64'
          assert d['archive']['filename'] == f'Rieke-OS-{version}-arm64.zip'
          p = Path('desktop/dist') / d['archive']['filename']
          assert 0 < p.stat().st_size == d['archive']['size'] <= 2 * 1024**3
          with p.open('rb') as stream: assert hashlib.file_digest(stream, 'sha256').hexdigest() == d['archive']['sha256']
          check = subprocess.check_output(['node', '-e', "process.stdout.write(require('./desktop/updater-validation.cjs').ARCHIVE_CHECK)"], text=True)
          subprocess.run([sys.executable, '-c', check, str(p)], check=True, timeout=120)
          PY
      - name: Extract and verify the frozen application
        timeout-minutes: 15
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          mkdir -p desktop/dist/mac-arm64
          ditto -x -k "desktop/dist/Rieke-OS-${VERSION}-arm64.zip" desktop/dist/mac-arm64
          uv run --no-project --python 3.11.13 python tools/desktop_test_release.py --app 'desktop/dist/mac-arm64/Rieke OS.app' --archive "desktop/dist/Rieke-OS-${VERSION}-arm64.zip" --output "$RUNNER_TEMP/recomputed-descriptor.json"
          cmp desktop/dist/desktop-release.json "$RUNNER_TEMP/recomputed-descriptor.json"
          codesign --verify --deep --strict 'desktop/dist/mac-arm64/Rieke OS.app'
          node - <<'JS'
          const fs=require('fs'), path=require('path');
          const runtime=path.resolve('desktop/dist/mac-arm64/Rieke OS.app/Contents/Resources/runtime');
          require('./desktop/updater-validation.cjs').verifyResources(runtime,JSON.parse(fs.readFileSync(path.join(runtime,'runtime-manifest.json'))).resources)
            .then(()=>console.log('Published runtime resources verified')).catch(error=>{console.error(error);process.exitCode=1;});
          JS
      - name: Verify the published native database on this host
        timeout-minutes: 10
        run: |
          uv run --no-project --python 3.11.13 python - <<'PY'
          import json, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from desktop_artifact_e2e import isolated_database_probe, inventory
          resources = Path('desktop/dist/mac-arm64/Rieke OS.app/Contents/Resources').resolve()
          before = inventory(resources / 'runtime')
          with tempfile.TemporaryDirectory(prefix='rieke-published-native-') as scratch:
              result = isolated_database_probe(resources, Path(scratch))
          assert before == inventory(resources / 'runtime')
          Path('desktop/build').mkdir(parents=True, exist_ok=True)
          Path('desktop/build/published-native-database.json').write_text(json.dumps({'passed': True, 'resources_unchanged': True, 'probe': result}, indent=2)+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.qualification_ref }}
          path: desktop/build/qualification-source
          persist-credentials: false
      - name: Connect reviewed qualification tools to the published candidate
        run: |
          QUALIFICATION_ROOT="$GITHUB_WORKSPACE/desktop/build/qualification-source"
          for source in desktop/*.cjs desktop/e2e/helpers.cjs desktop/package-lock.json; do
            cmp "$source" "$QUALIFICATION_ROOT/$source"
          done
          ln -s "$GITHUB_WORKSPACE/desktop/dist" "$QUALIFICATION_ROOT/desktop/dist"
          ln -s "$GITHUB_WORKSPACE/desktop/node_modules" "$QUALIFICATION_ROOT/desktop/node_modules"
          git -C "$QUALIFICATION_ROOT" rev-parse HEAD
      - name: Verify qualification helper observation tests
        working-directory: desktop/build/qualification-source
        run: node --test desktop/tests/helper-result.test.cjs
      - name: Verify native update, restore, rollback and real installed startup
        timeout-minutes: 60
        working-directory: desktop/build/qualification-source
        run: node desktop/e2e/testing-upgrade.e2e.cjs
      - name: Verify startup failure recovery
        timeout-minutes: 10
        working-directory: desktop/build/qualification-source
        run: node desktop/e2e/backend-failure.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-desktop-qualification-evidence
          path: |
            desktop/build/published-native-database.json
            desktop/build/qualification-source/docs/dev/desktop-testing-upgrade-e2e.json
            desktop/build/qualification-source/desktop/build/native-qualification-diagnostics/
            desktop/build/qualification-source/docs/dev/desktop-ui-e2e/
          if-no-files-found: warn
          retention-days: 30
