name: Verify source installation
on:
  push:
    branches: [main, master]
    paths: ['install.sh', 'install.ps1', 'rieke.py', 'python/workspace_bootstrap.py', 'python/workspace_mysql_runtime.py', 'python/workspace-mysql-runtime.json', 'python/workspace-runtime.lock', 'requirements.txt', '.github/workflows/verify.yml']
  pull_request:
    paths: ['install.sh', 'install.ps1', 'rieke.py', 'python/workspace_bootstrap.py', 'python/workspace_mysql_runtime.py', 'python/workspace-mysql-runtime.json', 'python/workspace-runtime.lock', 'requirements.txt', '.github/workflows/verify.yml']
  workflow_dispatch:
concurrency:
  group: source-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a fresh client folder with spaces
        run: |
          mkdir -p "$RUNNER_TEMP/Rieke Client"
          cp -R "$GITHUB_WORKSPACE/." "$RUNNER_TEMP/Rieke Client/"
      - name: Install into an empty runtime
        working-directory: ${{ runner.temp }}/Rieke Client
        run: ./install.sh
      - name: Check runtime
        working-directory: ${{ runner.temp }}/Rieke Client
        run: .rieke-runtime/venv/bin/python rieke.py doctor
      - name: Python tests
        working-directory: ${{ runner.temp }}/Rieke Client
        run: |
          PYTHONPATH=python .rieke-runtime/venv/bin/python -m unittest discover -s python/tests
          PYTHONPATH=python:python/tests .rieke-runtime/venv/bin/python -B -m unittest discover -s python/disco -t python -p 'test_*.py' -v
      - name: Browser logic tests
        working-directory: ${{ runner.temp }}/Rieke Client
        run: PATH="$PWD/.rieke-runtime/native/bin:$PATH" npm --prefix workspace-app test
